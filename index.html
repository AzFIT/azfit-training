<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AzFIT Client Portal</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — handle redirect from 404.html
      (function() {
        var redirect = window.location.search.match(/\?\/(.*)/);
        if (redirect) {
          var cleaned = redirect[1].replace(/~and~/g, '&');
          window.history.replaceState(null, null, '/' + cleaned + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
